<svg width="1200" height="220" viewBox="0 0 1200 220" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#111827"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="220" fill="url(#bg)"/>

  <g font-family="Segoe UI, Arial, sans-serif" font-weight="600">
    <rect x="60" y="50" width="300" height="120" rx="16" fill="#1E293B" stroke="#334155"/>
    <text x="90" y="105" fill="#E2E8F0" font-size="20">Start the stack</text>
    <text x="90" y="135" fill="#94A3B8" font-size="14">docker compose up --build</text>

    <rect x="450" y="50" width="300" height="120" rx="16" fill="#1E293B" stroke="#334155"/>
    <text x="480" y="105" fill="#E2E8F0" font-size="20">Run producer</text>
    <text x="480" y="135" fill="#94A3B8" font-size="14">docker compose run --rm producer</text>

    <rect x="840" y="50" width="300" height="120" rx="16" fill="#1E293B" stroke="#334155"/>
    <text x="870" y="105" fill="#E2E8F0" font-size="20">Open dashboard</text>
    <text x="870" y="135" fill="#94A3B8" font-size="14">http://localhost:3000</text>
  </g>

  <g stroke="#38BDF8" stroke-width="3" fill="none">
    <line x1="370" y1="110" x2="430" y2="110"/>
    <line x1="760" y1="110" x2="820" y2="110"/>
    <polyline points="420,100 430,110 420,120"/>
    <polyline points="810,100 820,110 810,120"/>
  </g>
</svg>
